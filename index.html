<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <title>Ferretería Pellahuén - Inicio</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg border-bottom shadow-sm">
        <div class="container-fluid d-flex flex-wrap align-items-center justify-content-between">
          <div class="d-flex align-items-center col-6 col-lg-3 order-1">
            <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navegacionPrincipal">
              <span class="navbar-toggler-icon"></span>
            </button>
            <h1 class="navbar-brand mb-0 h1">Pellahuén</h1>
          </div>
          <div class="d-flex gap-2 justify-content-end col-6 col-lg-3 order-2 order-lg-3">
            <button class="btn btn-outline-primary d-none d-lg-block">Inicia Sesión</button>
            <a href="carrito.html" class="btn btn-primary position-relative">
              <i class="bi bi-cart"></i>
              <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </a>
          </div>
          <div class="col-12 col-lg-6 mt-2 mt-lg-0 order-3 order-lg-2 collapse navbar-collapse" id="navegacionPrincipal">
            <form class="d-flex justify-content-center w-100" role="search">
              <div class="input-group" style="max-width: 500px; width: 100%">
                <input type="text" class="form-control" placeholder="Buscar en Pellahuén..." />
                <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
              </div>
            </form>
          </div>
        </div>
      </nav>
    </header>
    <main class="container-fluid py-4 flex-grow-1">
      <h2 class="border-bottom pb-2 mb-4">Lo más vendido</h2>
      <section id="contenedor-productos" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"></section>
    </main>
    <footer class="bg-dark text-light text-center py-4 mt-auto">
      <div class="container">
        <p class="mb-0">© 2026 Sociedad Constructora Pellahuén Ltda. - Venta de Materiales</p>
        <small>Contacto: ventas@pellahuen.cl | Tel: +56 9 1234 5678</small>
      </div>
    </footer>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/productos.js"></script>
    <script src="assets/js/carrito.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
