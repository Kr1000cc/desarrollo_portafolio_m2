<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
  <title>Detalle de Producto | Ferretería Pellahuén</title>
</head>
<body class="d-flex flex-column min-vh-100">
  <header>
    <nav class="navbar navbar-expand-lg border-bottom shadow-sm">
      <div class="container-fluid d-flex flex-wrap align-items-center justify-content-between">
        <div class="d-flex align-items-center col-6 col-lg-3 order-1">
          <a href="index.html" class="text-decoration-none text-dark d-flex align-items-center">
            <h1 class="navbar-brand mb-0 h1">Pellahuén</h1>
          </a>
        </div>
        <div class="d-flex gap-2 justify-content-end col-6 col-lg-3 order-2 order-lg-3">
          <a href="carrito.html" class="btn btn-primary position-relative">
            <i class="bi bi-cart"></i>
            <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
          </a>
        </div>
      </div>
    </nav>
  </header>
  <main id="contenedor-principal-detalle" class="container py-5 flex-grow-1">
    <div class="row gx-5">
      <div class="col-md-6 mb-4 text-center">
        <img id="detalle-imagen" src="" class="img-fluid border rounded shadow-sm p-3" alt="" style="max-height: 400px; object-fit: contain;">
      </div>
      <div class="col-md-6">
        <span id="detalle-categoria" class="badge text-bg-secondary mb-2"></span>
        <h2 id="detalle-nombre" class="display-5 fw-bold"></h2>
        <p id="detalle-precio" class="fs-3 text-primary fw-bold"></p>
        
        <p id="detalle-descripcion" class="lead"></p>

        <div class="d-grid gap-2 col-md-8 mt-4">
          <button id="btn-agregar-detalle" class="btn btn-primary btn-lg btn-agregar-carrito" data-id="">
            <i class="bi bi-cart-plus me-2"></i>Agregar al carro
          </button>
          <a href="index.html" class="btn btn-outline-secondary">Volver al catálogo</a>
        </div>
      </div>
    </div>
  </main>
  <footer class="bg-dark text-light text-center py-4 mt-auto">
    <div class="container">
      <p class="mb-0">© 2026 Sociedad Constructora Pellahuén Ltda. - Venta de Materiales</p>
    </div>
  </footer>
  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/productos.js"></script>
  <script src="assets/js/carrito.js"></script>
  <script src="assets/js/principal.js"></script>
  <script src="assets/js/vista-detalle.js"></script>
</body>
</html>
